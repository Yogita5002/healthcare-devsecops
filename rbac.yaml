apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-sa
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healthcare-read-own-secret
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["db-secret"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcare-read-own-secret-binding
subjects:
- kind: ServiceAccount
  name: healthcare-sa
roleRef:
  kind: Role
  name: healthcare-read-own-secret
  apiGroup: rbac.authorization.k8s.io
